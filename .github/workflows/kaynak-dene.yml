name: Kaynak dene
on:
  workflow_dispatch:
    inputs:
      adresler:
        description: 'Boşlukla ayrılmış adresler (boşsa varsayılan liste)'
        required: false
        default: ''
      spor:
        description: 'Adresleri TFF lig sayfası olarak dene'
        type: boolean
        default: false
      ham:
        description: 'Arama sonucunu ham HTML göster'
        type: boolean
        default: false
      ara:
        description: 'Sayfada aranacak ifade (regex)'
        required: false
        default: ''
      kaynaklar:
        description: 'Denenecek kaynak kimlikleri (sources.js), boşlukla'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  dene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - if: ${{ inputs.spor }}
        run: node scripts/spor-dene.js
        env:
          ADRESLER: ${{ inputs.adresler }}
      - if: ${{ inputs.kaynaklar == '' && !inputs.spor }}
        run: node scripts/kaynak-dene.js
        env:
          ADRESLER: ${{ inputs.adresler }}
          ARA: ${{ inputs.ara }}
          RAW: ${{ inputs.ham && '1' || '' }}
      - if: ${{ inputs.kaynaklar != '' }}
        run: for k in ${{ inputs.kaynaklar }}; do echo "=== $k"; node src/collect.js --dene $k || true; done
