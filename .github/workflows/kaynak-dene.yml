name: Kaynak dene
on:
  workflow_dispatch:
    inputs:
      adresler:
        description: 'Boşlukla ayrılmış adresler (boşsa varsayılan liste)'
        required: false
        default: ''
      kaynaklar:
        description: 'Denenecek kaynak kimlikleri (sources.js), boşlukla'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  dene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - if: ${{ inputs.kaynaklar == '' }}
        run: node scripts/kaynak-dene.js ${{ inputs.adresler }}
      - if: ${{ inputs.kaynaklar != '' }}
        run: for k in ${{ inputs.kaynaklar }}; do echo "=== $k"; node src/collect.js --dene $k || true; done
