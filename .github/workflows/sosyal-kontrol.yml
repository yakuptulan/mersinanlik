name: Sosyal medya bağlantı kontrolü

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Jetonun gördüğü sayfa ve Instagram hesabı
        run: node src/sosyal.js --kontrol && node src/sosyal.js --karsilastir
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
