name: Cloudflare Pages gizli değişkenleri (ilan formu için Telegram)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gizli:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Telegram bilgilerini Pages'e gizli değişken olarak yaz
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SOHBET="${TELEGRAM_CHAT_ID:-$(node -e 'try{process.stdout.write(require("./data/telegram.json").sohbet||"")}catch{}')}"
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$SOHBET" ]; then echo "Telegram bilgisi eksik (bot anahtarı ya da sohbet)"; exit 1; fi
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx --yes wrangler@4 pages secret put TELEGRAM_BOT_TOKEN --project-name=mersinanlik
          printf '%s' "$SOHBET" | npx --yes wrangler@4 pages secret put TELEGRAM_CHAT_ID --project-name=mersinanlik
          npx --yes wrangler@4 pages secret list --project-name=mersinanlik | sed 's/: .*/: (gizli)/'
