name: Cloudflare Pages gizli değişkenleri (ilan formu için Telegram)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gizli:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Telegram bilgilerini Pages'e gizli değişken olarak yaz
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx --yes wrangler@4 pages secret put TELEGRAM_BOT_TOKEN --project-name=mersinanlik
          printf '%s' "$TELEGRAM_CHAT_ID" | npx --yes wrangler@4 pages secret put TELEGRAM_CHAT_ID --project-name=mersinanlik
          npx --yes wrangler@4 pages secret list --project-name=mersinanlik | sed 's/: .*/: (gizli)/'
