name: Zamanlayıcıyı kur (Cloudflare)

# Cloudflare'de her 30 dakikada güncellemeyi başlatan küçük bir Worker kurar.
# Sadece zamanlayici/ klasörü değişince ya da elle çalıştırılınca çalışır.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['zamanlayici/**', '.github/workflows/zamanlayici.yml']

jobs:
  kur:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_HESAP: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
      AD: mersinanlik-zamanlayici
    steps:
      - uses: actions/checkout@v4
      - name: Worker'ı yayınla
        if: ${{ env.GH_DISPATCH_TOKEN != '' }}
        working-directory: zamanlayici
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CF_HESAP/workers/scripts/$AD"
          jq -n --arg t "$GH_DISPATCH_TOKEN" '{
            main_module: "index.js",
            compatibility_date: "2026-11-01",
            observability: {enabled: true},
            bindings: [{type: "secret_text", name: "GH_TOKEN", text: $t}]
          }' > /tmp/meta.json
          echo "1) Kod yükleniyor"
          curl -sS -X PUT "$API" -H "Authorization: Bearer $CF_TOKEN" \
            -F "metadata=@/tmp/meta.json;type=application/json" \
            -F "index.js=@index.js;type=application/javascript+module" > /tmp/r1.json
          jq '{success, errors}' /tmp/r1.json
          jq -e '.success' /tmp/r1.json > /dev/null
          echo "2) Zamanlama ayarlanıyor"
          curl -sS -X PUT "$API/schedules" -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" --data '[{"cron":"*/30 * * * *"}]' > /tmp/r2.json
          jq '{success, errors, result}' /tmp/r2.json
          jq -e '.success' /tmp/r2.json > /dev/null
          rm -f /tmp/meta.json
          echo "3) workers.dev adresi kapatılıyor"
          curl -sS -X POST "$API/subdomain" -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" --data '{"enabled":false}' | jq '{success, errors}'
          echo "4) GitHub anahtarı test ediliyor (güncellemeyi bir kez başlatır)"
          kod=$(curl -sS -o /tmp/r4.txt -w '%{http_code}' -X POST \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/guncelle.yml/dispatches" \
            -H "Authorization: Bearer $GH_DISPATCH_TOKEN" -H "Accept: application/vnd.github+json" \
            --data '{"ref":"main"}')
          echo "GitHub yanıtı: $kod"; cat /tmp/r4.txt
          [ "$kod" = "204" ]
      - name: Anahtar eksik
        if: ${{ env.GH_DISPATCH_TOKEN == '' }}
        run: echo "GH_DISPATCH_TOKEN sırrı tanımlı değil; zamanlayıcı kurulmadı."
