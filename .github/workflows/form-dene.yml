name: İlan formu denemesi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dene:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Canlı forma deneme ilanı gönder
        run: |
          curl -s -m 30 https://mersinanlik.com/api/ilan-ver; echo; curl -s -m 30 -X POST https://mersinanlik.com/api/ilan-ver -H 'Content-Type: application/json' \
            -d '{"isyeri":"TEST - Mersin Anlık","pozisyon":"Deneme ilanı (lütfen Reddet)","ilce":"yenisehir","kisi":1,"calisma":"Tam zamanlı","telefon":"0324 000 00 00","aciklama":"Bu bir sistem denemesidir, lütfen Reddet düğmesine basın. Form ve Telegram bağlantısı test ediliyor.","onay":true,"sure":9000}' \
            -w "\nHTTP %{http_code}\n"
