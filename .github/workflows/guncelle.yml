name: Haberleri güncelle ve yayınla

on:
  schedule:
    # Asıl zamanlayıcı Cloudflare Worker (30 dakikada bir). Bu yalnızca yedek: 3 saatte bir.
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      bilgi_zorla:
        description: 'Merak edilenler yazısını saat/aralık beklemeden yaz'
        type: boolean
        default: false
      haftasonu_zorla:
        description: 'Hafta sonu rehberini gün/saat beklemeden yaz'
        type: boolean
        default: false
  push:
    branches: [main]

concurrency:
  group: guncelle
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # Search Console için anahtarsız Google girişi (Workload Identity)

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Sırada bekleyen çalışmalar da en güncel veriden başlasın
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Testler
        run: npm test

      - name: Haberleri topla
        run: node src/collect.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Servisler (hava, deprem, eczane, piyasa, spor, etkinlik, burç)
        run: node src/services.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Sabah bildirimleri (Benim Gündemim)
        run: node src/bildirim.js
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 81 il akaryakıt ve namaz vakitleri (döngüsel)
        timeout-minutes: 5
        continue-on-error: true
        run: node src/ulusal.js || true

      - name: Kulüp logoları
        run: node src/logolar.js || true

      - name: Maç sonu haberleri (Mersin takımları)
        run: node src/mac.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Okul tatili kararları
        run: node src/okul.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: 81 il okul tatili kararları
        run: node src/okul81.js || true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}


      - name: Mersin iş ilanları (İŞKUR, 3 saatte bir)
        timeout-minutes: 5
        continue-on-error: true
        run: node src/isIlanlari.js || true
      - name: Veriden otomatik haberler (akaryakıt, deprem, su, hava, eczane, okul, yollar…)
        run: node src/otomatik.js

      - name: Günün özeti (sabah bülteni)
        run: node src/ozet.js ${{ inputs.bilgi_zorla && '--simdi' || '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Merak edilenler (günde 2 bilgi yazısı)
        run: node src/bilgi.js ${{ inputs.bilgi_zorla && '--simdi --liste' || '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Gezi rehberi (günde birkaç yer)
        run: node src/gezi.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Hafta sonu rehberi (perşembe/cuma)
        run: node src/haftasonu.js ${{ inputs.haftasonu_zorla && '--simdi' || '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Temsili fotoğrafları indir (sadece eksik olanlar)
        run: node scripts/foto-indir.js

      - name: Futbolcu fotoğrafları (Wikimedia Commons, özgür lisans)
        run: node scripts/oyuncu-foto.js || true

      - name: Ziyaretçi trafiği (Cloudflare, 3 saatte bir)
        run: node src/trafik.js || true

      - name: Google girişi (anahtarsız, sadece Search Console okuma)
        id: google
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1047223083910/locations/global/workloadIdentityPools/github/providers/github
          service_account: gsc-okuyucu@mersinanlik.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters.readonly
          create_credentials_file: false

      - name: Search Console verisi (6 saatte bir)
        run: node src/gsc.js || true
        env:
          GSC_TOKEN: ${{ steps.google.outputs.access_token }}
          GSC_ANAHTAR: ${{ secrets.GSC_ANAHTAR }}

      - name: Günlük işleyiş raporu
        run: node src/rapor.js || true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Google girişi (görsel üretimi, Vertex AI)
        id: vertex
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1047223083910/locations/global/workloadIdentityPools/github/providers/github
          service_account: gorsel-uretici@mersinanlik.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: false

      - name: Kaliteli görseller (Gemini; sosyal medya ve manşet, günde en fazla 17)
        timeout-minutes: 6
        continue-on-error: true
        run: node src/sosyal.js --gorsel
        env:
          VERTEX_TOKEN: ${{ steps.vertex.outputs.access_token }}
          GEMINI_GORSEL_KEY: ${{ secrets.GEMINI_GORSEL_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Siteyi üret
        run: node src/build.js

      - name: Sosyal medya kuyruğu (sıradaki haber, Instagram kartı)
        run: node src/sosyal.js --hazirla || true
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}

      - name: Verileri kaydet
        run: |
          git config user.name "mersinanlik-bot"
          git config user.email "bot@mersinanlik.com"
          git add -A data/ public/foto/ public/uretilen/ public/etkinlik/ public/bilgi/ public/gezi/ public/logo/ public/bayrak/ public/oyuncu/
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
          else
            git commit -m "Veri güncellemesi $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -X theirs --autostash || { git rebase --abort; git pull --no-rebase -X ours --no-edit; }
            git push
          fi

      - name: Cloudflare'e yayınla
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          # Proje yoksa ilk seferde oluştur (varsa hata verir, yok sayılır)
          npx --yes wrangler@4 pages project create mersinanlik --production-branch=main || true
          # Bildirim aboneliği için KV bağlantısı (KV alanı kurulduysa)
          KV=$(node -e 'try{process.stdout.write(require("./data/bildirim.json").kvId||"")}catch{}')
          if [ -n "$KV" ]; then printf 'name = "mersinanlik"\npages_build_output_dir = "dist"\ncompatibility_date = "2026-11-01"\n\n[[kv_namespaces]]\nbinding = "ABONE"\nid = "%s"\n' "$KV" > wrangler.toml; fi
          npx --yes wrangler@4 pages deploy dist --project-name=mersinanlik --branch=main --commit-dirty=true

      - name: Facebook ve Instagram'da paylaş
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          sleep 15
          node src/sosyal.js --paylas || true
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}

      - name: IndexNow (Bing ve diğer arama motorlarına bildir)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          sleep 10
          node src/indexnow.js || true
          git add data/indexnow.json data/sosyal.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "IndexNow ve sosyal medya durumu"
            git pull --rebase -X theirs --autostash || { git rebase --abort; git pull --no-rebase -X ours --no-edit; }
            git push || true
          fi
