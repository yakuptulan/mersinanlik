name: Haberleri güncelle ve yayınla

on:
  schedule:
    # Asıl zamanlayıcı Cloudflare Worker (30 dakikada bir). Bu yalnızca yedek: 3 saatte bir.
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      bilgi_zorla:
        description: 'Merak edilenler yazısını saat/aralık beklemeden yaz'
        type: boolean
        default: false
      haftasonu_zorla:
        description: 'Hafta sonu rehberini gün/saat beklemeden yaz'
        type: boolean
        default: false
  push:
    branches: [main]

concurrency:
  group: guncelle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Sırada bekleyen çalışmalar da en güncel veriden başlasın
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Testler
        run: npm test

      - name: Haberleri topla
        run: node src/collect.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Servisler (hava, deprem, eczane, piyasa, spor, etkinlik, burç)
        run: node src/services.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Sabah bildirimleri (Benim Gündemim)
        run: node src/bildirim.js
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Kulüp logoları
        run: node src/logolar.js || true

      - name: Maç sonu haberleri (Mersin takımları)
        run: node src/mac.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Okul tatili kararları
        run: node src/okul.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Veriden otomatik haberler (akaryakıt, deprem, su, hava, eczane, okul, yollar…)
        run: node src/otomatik.js

      - name: Günün özeti (sabah bülteni)
        run: node src/ozet.js ${{ inputs.bilgi_zorla && '--simdi' || '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Merak edilenler (günde 2 bilgi yazısı)
        run: node src/bilgi.js ${{ inputs.bilgi_zorla && '--simdi --liste' || '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Gezi rehberi (günde birkaç yer)
        run: node src/gezi.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Hafta sonu rehberi (perşembe/cuma)
        run: node src/haftasonu.js ${{ inputs.haftasonu_zorla && '--simdi' || '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Temsili fotoğrafları indir (sadece eksik olanlar)
        run: node scripts/foto-indir.js

      - name: Search Console verisi (6 saatte bir)
        run: node src/gsc.js || true
        env:
          GSC_ANAHTAR: ${{ secrets.GSC_ANAHTAR }}

      - name: Günlük işleyiş raporu
        run: node src/rapor.js || true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Siteyi üret
        run: node src/build.js

      - name: Verileri kaydet
        run: |
          git config user.name "mersinanlik-bot"
          git config user.email "bot@mersinanlik.com"
          git add -A data/ public/foto/ public/uretilen/ public/etkinlik/ public/bilgi/ public/gezi/ public/logo/ public/bayrak/
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
          else
            git commit -m "Veri güncellemesi $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -X theirs --autostash || { git rebase --abort; git pull --no-rebase -X ours --no-edit; }
            git push
          fi

      - name: Cloudflare'e yayınla
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          # Proje yoksa ilk seferde oluştur (varsa hata verir, yok sayılır)
          npx --yes wrangler@4 pages project create mersinanlik --production-branch=main || true
          # Bildirim aboneliği için KV bağlantısı (KV alanı kurulduysa)
          KV=$(node -e 'try{process.stdout.write(require("./data/bildirim.json").kvId||"")}catch{}')
          if [ -n "$KV" ]; then printf 'name = "mersinanlik"\npages_build_output_dir = "dist"\ncompatibility_date = "2026-11-01"\n\n[[kv_namespaces]]\nbinding = "ABONE"\nid = "%s"\n' "$KV" > wrangler.toml; fi
          npx --yes wrangler@4 pages deploy dist --project-name=mersinanlik --branch=main --commit-dirty=true
