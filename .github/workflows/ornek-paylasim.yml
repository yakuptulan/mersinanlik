name: Örnek paylaşımlar

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  ornek:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Google girişi (Vertex AI)
        id: vertex
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1047223083910/locations/global/workloadIdentityPools/github/providers/github
          service_account: gorsel-uretici@mersinanlik.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: false
      - name: Örnek paylaşımları hazırla
        run: node scripts/ornek-paylasim.js
        env:
          VERTEX_TOKEN: ${{ steps.vertex.outputs.access_token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Sonuçları ornekler dalına yaz
        run: |
          cd ornekler
          git init -q -b ornekler
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Örnekler $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ornekler
